# 역할·모델·effort·허용 경로의 원본. 생성물 .claude/agents/*.md, .codex/agents/*.toml,
# .codex/config.toml은 직접 편집하지 않는다.
# 갱신: ./.venv/Scripts/python.exe scripts/harness.py render
schema_version = 1
harness_version = "1.0"  # 변경 이력은 docs/DEVELOPMENT_WORKFLOW.md §10

[policy]
lead = "starting_session"
model_unavailable = "stop_and_report"
git_push = "explicit_request_only"
live_broker_calls = "explicit_request_only"

# 문서 표기용 모델 이름. AGENTS.md·README.md·docs/DEVELOPMENT_WORKFLOW.md의 역할 표가 이 원본과
# 어긋나면 tests/test_harness_scripts.py가 실패한다. 새 모델을 쓰면 여기에도 추가한다.
[display.models]
"claude-opus-5-5" = "Opus 5.5"
"claude-sonnet-5" = "Sonnet 5"
"gpt-6-sol" = "GPT-6 Sol"
"gpt-6-luna" = "GPT-6 Luna"
"gpt-5.6-terra" = "GPT-5.6 Terra"

# lead는 대화를 시작한 세션 자신이라 역할 파일을 만들지 않는다.
# Codex는 이 값으로 .codex/config.toml을 생성하고, Claude Code는 .claude/settings.json의
# model·effortLevel을 쓴다(권한 설정과 한 파일이라 손으로 관리하고 테스트로 이 값과 대조한다).
[lead]
claude_model = "claude-opus-5-5"
codex_model = "gpt-6-sol"
effort = "xhigh"

[roles.scout]
description = "실제 코드 경로와 영향 범위를 읽기 전용으로 조사한다."
claude_model = "claude-sonnet-5"
codex_model = "gpt-6-luna"
effort = "low"
read_only = true
allowed_paths = []

[roles.backend]
description = "FastAPI·DB·트레이딩 로직과 회귀 테스트를 구현한다."
claude_model = "claude-opus-5-5"
codex_model = "gpt-5.6-terra"
effort = "high"
read_only = false
allowed_paths = ["app/", "migrations/", "tests/", "docs/"]

[roles.frontend]
description = "React/Vite 대시보드와 브라우저 회귀를 구현한다."
claude_model = "claude-opus-5-5"
codex_model = "gpt-5.6-terra"
effort = "high"
read_only = false
allowed_paths = ["frontend/", "docs/"]

[roles.qa]
description = "실주문·청산·거래 모드·인증 변경의 테스트를 구현과 독립적으로 계약 기준으로 작성한다. 테스트만 수정한다."
claude_model = "claude-opus-5-5"
codex_model = "gpt-6-sol"
effort = "high"
read_only = false
allowed_paths = ["tests/"]

[roles.reviewer]
description = "실주문·청산·거래 모드·인증 경계 diff를 독립 검토한다. 소스를 수정하지 않는다."
claude_model = "claude-opus-5-5"
codex_model = "gpt-6-sol"
effort = "xhigh"
read_only = true
allowed_paths = []
