[project]
name = "ai-trade-manager"
version = "0.1.0"
description = "Upbit KRW spot trading bot (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0.28",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "httpx>=0.27",
  "websockets>=12.0",
  "python-dotenv>=1.0",
  "PyJWT>=2.8",
  "slack-sdk>=3.27",
  "slack-bolt>=1.20.0",
  "aiohttp>=3.9",
  "openai>=1.12.0",
  "langgraph>=0.4.0",
  "langchain>=0.3.0",
  "langchain-google-genai>=2.1.0",
  "langchain-openai>=0.3.0",
  "google-genai>=0.12.0",
  "tenacity>=8.2.0",
  "feedparser>=6.0.11",
  "apscheduler>=3.10.4",
  "pandas>=2.2.0",
  "pandas-ta-classic>=0.3.78",
  "opensearch-py>=2.8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "ruff>=0.3"
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
  "postgres: 실제 PostgreSQL 동작과 동시성을 검증하는 통합 테스트",
  "architecture: 실주문 아키텍처 경계를 검증하는 정적 테스트",
  "migration: Alembic SQL 및 실제 데이터베이스 전이를 검증하는 테스트"
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["logs*", "tests*"]
